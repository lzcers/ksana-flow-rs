[workspace]
members = ["flow", "nodes", "server"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
tokio = { version = "1.49.0", features = ["full"] }
tokio-util = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flow = { path = "flow" }
nodes = { path = "nodes" }
anyhow = "1.0.97"
chrono = "0.4.40"
